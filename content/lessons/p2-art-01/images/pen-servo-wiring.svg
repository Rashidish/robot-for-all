<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="system-ui, sans-serif">
  <rect x="100" y="16" width="220" height="70" rx="8" fill="#2c7a3f" stroke="#1f1a14" stroke-width="2"/>
  <rect x="145" y="4" width="130" height="40" rx="6" fill="#1f1a14"/>
  <g font-size="10" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="210" y="28">micro:bit</text>
    <text x="150" y="74">P16</text><text x="270" y="74">GND</text>
  </g>
  <g fill="#e9b949" stroke="#1f1a14" stroke-width="1.5">
    <circle cx="150" cy="82" r="4"/><circle cx="270" cy="82" r="4"/>
  </g>
  <!-- Servo battery pack: 3 × AA, 4.5 V, only for the servo. -->
  <rect x="300" y="200" width="100" height="70" rx="6" fill="#e8e2d6" stroke="#1f1a14" stroke-width="2"/>
  <g fill="#c9c2b4" stroke="#1f1a14" stroke-width="1.5">
    <rect x="310" y="212" width="80" height="14" rx="7"/><rect x="310" y="230" width="80" height="14" rx="7"/><rect x="310" y="248" width="80" height="14" rx="7"/>
  </g>
  <g font-size="11" font-weight="700" fill="#1f1a14" text-anchor="middle">
    <text x="296" y="196" text-anchor="end">+</text><text x="404" y="196" text-anchor="start">−</text>
  </g>
  <!-- SG90 servo with its arm under the pen collar; pen in its sleeve. -->
  <rect x="60" y="200" width="90" height="44" rx="4" fill="#1d5fbf" stroke="#1f1a14" stroke-width="2"/>
  <text x="105" y="227" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">servo</text>
  <circle cx="130" cy="190" r="8" fill="#fff" stroke="#1f1a14" stroke-width="2"/>
  <path d="M130 190H196" stroke="#1f1a14" stroke-width="6" stroke-linecap="round"/>
  <rect x="200" y="150" width="20" height="130" rx="4" fill="#8e44ad" stroke="#1f1a14" stroke-width="2"/>
  <rect x="190" y="176" width="40" height="10" fill="#d9b98c" stroke="#1f1a14" stroke-width="1.5"/>
  <rect x="194" y="210" width="32" height="56" fill="none" stroke="#1f1a14" stroke-width="2" stroke-dasharray="5 4"/>
  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 86V130H80V200" stroke="#e67e22"/>
    <path d="M270 86V140H380V200" stroke="#5a3a1a"/>
    <path d="M380 140H100V200" stroke="#5a3a1a"/>
    <path d="M320 200V160H120V200" stroke="#c0392b"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#1f1a14">
    <circle cx="334" cy="20" r="11" fill="#fff" stroke="#1f1a14" stroke-width="2"/><text x="334" y="25">1</text>
    <circle cx="44" cy="222" r="11" fill="#fff" stroke="#1f1a14" stroke-width="2"/><text x="44" y="227">2</text>
    <circle cx="350" cy="286" r="11" fill="#fff" stroke="#1f1a14" stroke-width="2"/><text x="350" y="291">3</text>
    <circle cx="250" cy="181" r="11" fill="#fff" stroke="#1f1a14" stroke-width="2"/><text x="250" y="186">4</text>
  </g>
</svg>
