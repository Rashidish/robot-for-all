<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="system-ui, sans-serif">
  <rect x="110" y="16" width="200" height="70" rx="8" fill="#2c7a3f" stroke="#1f1a14" stroke-width="2"/>
  <rect x="145" y="4" width="130" height="40" rx="6" fill="#1f1a14"/>
  <g font-size="10" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="210" y="28">micro:bit</text>
    <text x="150" y="74">P12</text><text x="210" y="74">3V</text><text x="270" y="74">P15</text>
  </g>
  <g fill="#e9b949" stroke="#1f1a14" stroke-width="1.5">
    <circle cx="150" cy="82" r="4"/><circle cx="210" cy="82" r="4"/><circle cx="270" cy="82" r="4"/>
  </g>
  <!-- Cardboard bumper front, seen from above, with the robot behind it. -->
  <rect x="60" y="200" width="300" height="30" rx="4" fill="#d9b98c" stroke="#1f1a14" stroke-width="2"/>
  <rect x="120" y="230" width="180" height="56" rx="6" fill="#e8e2d6" stroke="#1f1a14" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="210" y="264" font-size="11" text-anchor="middle" fill="#1f1a14">robot</text>
  <!-- Foil strips on the bumper. -->
  <rect x="96" y="194" width="44" height="10" fill="#c7ccd1" stroke="#1f1a14" stroke-width="1.5"/>
  <rect x="280" y="194" width="44" height="10" fill="#c7ccd1" stroke="#1f1a14" stroke-width="1.5"/>
  <!-- Paper-clip whiskers: fixed at the outside edge, bent forward in front of the foil. -->
  <g fill="none" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 214V184H150L176 168"/>
    <path d="M344 214V184H270L244 168"/>
  </g>
  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 86V120H76V210" stroke="#c0392b"/>
    <path d="M210 120H344V210" stroke="#c0392b"/>
    <path d="M150 86V108H40V244H118V204" stroke="#2e8b57"/>
    <path d="M270 86V108H392V244H302V204" stroke="#2980b9"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#1f1a14">
    <circle cx="324" cy="20" r="11" fill="#fff" stroke="#1f1a14" stroke-width="2"/><text x="324" y="25">1</text>
    <circle cx="232" cy="136" r="11" fill="#fff" stroke="#1f1a14" stroke-width="2"/><text x="232" y="141">2</text>
    <circle cx="188" cy="166" r="11" fill="#fff" stroke="#1f1a14" stroke-width="2"/><text x="188" y="171">3</text>
    <circle cx="160" cy="215" r="11" fill="#fff" stroke="#1f1a14" stroke-width="2"/><text x="160" y="220">4</text>
  </g>
</svg>
