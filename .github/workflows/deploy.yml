name: Deploy

# Publishes the site to Cloudflare Pages (ADR-0002).
# - Pushes to main → production (only reviewed, published lessons: SHOW_DRAFTS=false)
# - Pull requests from this repo → a private preview URL with drafts shown
# Needs two repository secrets set by the owner: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until they exist, this workflow skips deployment with a notice instead of failing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Never expose secrets to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check deployment secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to switch it on (see docs/deploy.md)."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: env.HAS_TOKEN == 'true'
        run: npm ci
      - name: On-screen micro:bit (cached; built from source when its version or patches change)
        id: simulator-cache
        if: env.HAS_TOKEN == 'true'
        uses: actions/cache@v4
        with:
          path: apps/web/public/simulator
          key: simulator-${{ hashFiles('apps/web/simulator.json', 'patches/simulator/**', 'scripts/build-simulator.sh', 'scripts/vendor-simulator.mjs') }}
      - name: Build the on-screen micro:bit
        if: env.HAS_TOKEN == 'true' && steps.simulator-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-simulator.sh
      - name: Build (production hides drafts; previews show them)
        if: env.HAS_TOKEN == 'true'
        run: npm run build
        env:
          SHOW_DRAFTS: ${{ github.event_name == 'push' && 'false' || 'true' }}
      - name: Create the Pages project on first run
        if: env.HAS_TOKEN == 'true'
        run: |
          if npx wrangler pages project list | grep -q 'robot-for-all'; then
            echo "Pages project robot-for-all exists."
          else
            npx wrangler pages project create robot-for-all --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish
        if: env.HAS_TOKEN == 'true'
        run: >
          npx wrangler pages deploy apps/web/dist
          --project-name=robot-for-all
          --branch=${{ github.event_name == 'push' && 'main' || github.head_ref }}
          --commit-hash=${{ github.sha }}
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build the drafts preview (main with drafts shown, for reviewers)
        if: env.HAS_TOKEN == 'true' && github.event_name == 'push'
        # Content review spec §6.2: reviewers read drafts as learners will. Deployed to the
        # "drafts" alias, which Cloudflare Access protects (docs/deploy.md §5). Never production.
        run: npm run build
        env:
          SHOW_DRAFTS: 'true'
      - name: Publish the drafts preview
        if: env.HAS_TOKEN == 'true' && github.event_name == 'push'
        run: >
          npx wrangler pages deploy apps/web/dist
          --project-name=robot-for-all
          --branch=drafts
          --commit-hash=${{ github.sha }}
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check security headers on the live site
        if: env.HAS_TOKEN == 'true'
        # The local test server copies Cloudflare's _headers rules; this checks Cloudflare agrees.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # The production address: SITE_URL (repo variable) once the domain is connected.
            base="${{ vars.SITE_URL || 'https://robot-for-all.pages.dev' }}"
          else
            alias=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
            base="https://${alias}.robot-for-all.pages.dev"
          fi
          sleep 20
          for path in / /code/; do
            echo "== ${base}${path}"
            curl -sSI "${base}${path}" | grep -iE '^(content-security-policy|permissions-policy):' | tee "/tmp/h$(echo $path | tr / _)"
          done
          code_csp=$(grep -ic '^content-security-policy:' /tmp/h_code_ || true)
          if [ "$code_csp" != "1" ] || ! grep -q "sha256-" /tmp/h_code_; then
            echo "::error::/code/ must have exactly one Content-Security-Policy, with Blockly's style hashes"; exit 1
          fi
          if grep -qi "sha256-\|usb=(self)" /tmp/h_; then
            echo "::error::The home page must keep the strict policy"; exit 1
          fi
          echo "Live headers are as expected."
      - name: On-screen micro:bit works on the live site
        if: env.HAS_TOKEN == 'true'
        # Same browser tests as CI, but against Cloudflare itself (real headers, redirects, caching).
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # The production address: SITE_URL (repo variable) once the domain is connected.
            base="${{ vars.SITE_URL || 'https://robot-for-all.pages.dev' }}"
          else
            alias=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
            base="https://${alias}.robot-for-all.pages.dev"
          fi
          npx playwright install --with-deps chromium > /dev/null
          LIVE_URL="$base" npx playwright test tests/e2e/code.spec.ts --grep "on-screen micro:bit" --retries=1

  deploy-admin:
    name: Deploy the back office (Cloudflare Worker)
    runs-on: ubuntu-latest
    # Only from main, and only once the owner has set it up (docs/deploy.md §5): the repository
    # variable ADMIN_DEPLOY=true plus the Cloudflare secrets. Pull requests never deploy it.
    if: github.event_name == 'push' && vars.ADMIN_DEPLOY == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:admin
      - name: Publish the Worker (admin.robotsforall.org.za)
        working-directory: apps/admin
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: The live back office refuses requests that bypass Cloudflare Access
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}' https://admin.robotsforall.org.za/sign-in/)
          # Access answers unknown visitors with its own login page (302 to cloudflareaccess.com)
          # or 403; the app itself never shows the sign-in page without Access.
          case "$code" in 302|403) echo "Gate in place ($code).";; *) echo "::error::Got $code"; exit 1;; esac
