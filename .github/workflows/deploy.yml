name: Deploy

# Publishes the site to Cloudflare Pages (ADR-0002).
# - Pushes to main → production (only reviewed, published lessons: SHOW_DRAFTS=false)
# - Pull requests from this repo → a private preview URL with drafts shown
# Needs two repository secrets set by the owner: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until they exist, this workflow skips deployment with a notice instead of failing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Never expose secrets to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check deployment secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to switch it on (see docs/deploy.md)."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: env.HAS_TOKEN == 'true'
        run: npm ci
      - name: On-screen micro:bit (cached; built from source when its version or patches change)
        id: simulator-cache
        if: env.HAS_TOKEN == 'true'
        uses: actions/cache@v4
        with:
          path: apps/web/public/simulator
          key: simulator-${{ hashFiles('apps/web/simulator.version', 'patches/simulator/**', 'scripts/build-simulator.sh', 'scripts/vendor-simulator.mjs') }}
      - name: Build the on-screen micro:bit
        if: env.HAS_TOKEN == 'true' && steps.simulator-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-simulator.sh
      - name: Build (production hides drafts; previews show them)
        if: env.HAS_TOKEN == 'true'
        run: npm run build
        env:
          SHOW_DRAFTS: ${{ github.event_name == 'push' && 'false' || 'true' }}
      - name: Create the Pages project on first run
        if: env.HAS_TOKEN == 'true'
        run: |
          if npx wrangler pages project list | grep -q 'robot-for-all'; then
            echo "Pages project robot-for-all exists."
          else
            npx wrangler pages project create robot-for-all --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish
        if: env.HAS_TOKEN == 'true'
        run: >
          npx wrangler pages deploy apps/web/dist
          --project-name=robot-for-all
          --branch=${{ github.event_name == 'push' && 'main' || github.head_ref }}
          --commit-hash=${{ github.sha }}
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check security headers on the live site
        if: env.HAS_TOKEN == 'true'
        # The local test server copies Cloudflare's _headers rules; this checks Cloudflare agrees.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="https://robot-for-all.pages.dev"
          else
            alias=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
            base="https://${alias}.robot-for-all.pages.dev"
          fi
          sleep 20
          for path in / /code/; do
            echo "== ${base}${path}"
            curl -sSI "${base}${path}" | grep -iE '^(content-security-policy|permissions-policy):' | tee "/tmp/h$(echo $path | tr / _)"
          done
          code_csp=$(grep -ic '^content-security-policy:' /tmp/h_code_ || true)
          if [ "$code_csp" != "1" ] || ! grep -q "sha256-" /tmp/h_code_; then
            echo "::error::/code/ must have exactly one Content-Security-Policy, with Blockly's style hashes"; exit 1
          fi
          if grep -qi "sha256-\|usb=(self)" /tmp/h_; then
            echo "::error::The home page must keep the strict policy"; exit 1
          fi
          echo "Live headers are as expected."
