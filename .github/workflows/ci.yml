name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  content:
    name: Content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Translation files are valid JSON
        run: for f in content/i18n/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Every lesson has front matter
        run: |
          for f in content/lessons/*/index.md; do
            head -1 "$f" | grep -q '^---$' || { echo "Missing front matter: $f"; exit 1; }
          done

  app:
    name: Lint, types, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exact versions from package-lock.json)
        run: |
          if ! npm ci; then
            echo "::error::package-lock.json is out of date. A regenerated lockfile is printed below (base64 tar.gz) so it can be committed."
            npm install --no-audit > /dev/null
            echo "LOCKFILE-BEGIN"
            tar czf - package-lock.json | base64 -w 2000
            echo "LOCKFILE-END"
            exit 1
          fi
      - name: Resolved versions
        run: npm ls --depth=0 --workspaces --include-workspace-root
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: Format
        # On failure, show exactly what Prettier would change.
        run: npm run format:check || (npx prettier --write . > /dev/null; git --no-pager diff; exit 1)
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: On-screen micro:bit (cached; built from source when its version or patches change)
        id: simulator-cache
        uses: actions/cache@v4
        with:
          path: apps/web/public/simulator
          key: simulator-${{ hashFiles('apps/web/simulator.json', 'patches/simulator/**', 'scripts/build-simulator.sh', 'scripts/vendor-simulator.mjs') }}
      - name: Build the on-screen micro:bit
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-simulator.sh
      - name: Build
        run: npm run build
      - name: No inline scripts or styles (strict CSP)
        run: node scripts/check-no-inline.mjs apps/web/dist
      - name: Build the back office (ADR-0009, ADR-0011)
        run: npm run build:admin
      - name: Back office refuses every page without Cloudflare Access
        run: bash scripts/check-admin-gate.sh
      - name: Service worker is valid JavaScript
        run: node --check apps/web/dist/sw.js && grep -c '"/offline/"' apps/web/dist/sw.js
      - name: Page size budgets (fail when exceeded)
        run: |
          node scripts/measure-build.mjs apps/web/dist . home 150
          node scripts/measure-build.mjs apps/web/dist lessons lesson-list 250
          node scripts/measure-build.mjs apps/web/dist lessons/p1-crank-01 lesson 250
          node scripts/measure-build.mjs apps/web/dist code code-editor 450
      - name: Install browser for tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (360 px phone, offline, accessibility)
        run: npm run e2e
      - name: Lighthouse (performance and accessibility at least 90)
        run: |
          npm run lighthouse
          node -e "for (const r of require('./.lighthouseci/manifest.json')) console.log(r.url, Object.entries(r.summary).map(([k, v]) => k + ' ' + Math.round(v * 100)).join(', '))"
      - name: Production build hides unreviewed lessons
        run: |
          npm run build:production
          if [ -e apps/web/dist/lessons/p1-crank-01/index.html ]; then
            echo "::error::A draft lesson was published in the production build"; exit 1
          fi
          if [ -e apps/web/dist/templates/p1-crank-01/rhino-parts/index.html ]; then
            echo "::error::A draft lesson's template was published in the production build"; exit 1
          fi
          echo "Draft lessons and their templates are hidden in production."
      - name: Save test report and 360 px screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
