name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  content:
    name: Content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Translation files are valid JSON
        run: for f in content/i18n/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Every lesson has front matter
        run: |
          for f in content/lessons/*/index.md; do
            head -1 "$f" | grep -q '^---$' || { echo "Missing front matter: $f"; exit 1; }
          done

  app:
    name: Lint, types, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exact versions from package-lock.json)
        run: |
          if ! npm ci; then
            echo "::error::package-lock.json is out of date. A regenerated lockfile is printed below (base64 tar.gz) so it can be committed."
            npm install --no-audit > /dev/null
            echo "LOCKFILE-BEGIN"
            tar czf - package-lock.json | base64 -w 2000
            echo "LOCKFILE-END"
            exit 1
          fi
      - name: Resolved versions
        run: npm ls --depth=0 --workspaces --include-workspace-root
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: Format
        # On failure, show exactly what Prettier would change.
        run: npm run format:check || (npx prettier --write . > /dev/null; git --no-pager diff; exit 1)
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Service worker is valid JavaScript
        run: node --check apps/web/dist/sw.js && grep -c '"/offline/"' apps/web/dist/sw.js
      - name: Page sizes
        run: |
          node scripts/measure-build.mjs apps/web/dist . home
          node scripts/measure-build.mjs apps/web/dist lessons lesson-list
          node scripts/measure-build.mjs apps/web/dist lessons/p1-crank-01 lesson

  # Coming in later M1 steps: Playwright e2e and offline tests, Lighthouse CI, size budgets that fail the build.
