name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  content:
    name: Content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Translation files are valid JSON
        run: for f in content/i18n/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Every lesson has front matter
        run: |
          for f in content/lessons/*/index.md; do
            head -1 "$f" | grep -q '^---$' || { echo "Missing front matter: $f"; exit 1; }
          done

  # Added in M1 step 2 once the framework is chosen (ADR-001):
  # lint, type-check, unit tests, build, Playwright e2e, Lighthouse CI, bundle-size budgets.
