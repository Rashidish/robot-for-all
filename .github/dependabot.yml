version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro-svelte:
        patterns: ['astro', '@astrojs/*', 'svelte']
      lint-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'globals']
