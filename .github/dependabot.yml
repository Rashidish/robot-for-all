version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8.x does not support TypeScript 7 yet (see PR #6).
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      astro-svelte:
        patterns: ['astro', '@astrojs/*', 'svelte']
      lint-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'globals']
